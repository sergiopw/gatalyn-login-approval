services:
  db:
    image: mariadb:11.4
    container_name: wla-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:7.0.2-php8.2-apache
    container_name: wla-wordpress
    restart: unless-stopped
    depends_on:
      - db
      - mailpit
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
    volumes:
      - wordpress_data:/var/www/html
      - ./includes:/var/www/html/wp-content/plugins/gatalyn-login-approval/includes
      - ./gatalyn-login-approval.php:/var/www/html/wp-content/plugins/gatalyn-login-approval/gatalyn-login-approval.php
      - ./uninstall.php:/var/www/html/wp-content/plugins/gatalyn-login-approval/uninstall.php
      - ./.docker/local-mailpit.php:/var/www/html/wp-content/mu-plugins/local-mailpit.php

  wpcli:
    image: wordpress:cli-php8.2
    container_name: wla-wpcli
    depends_on:
      - db
      - wordpress
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./includes:/var/www/html/wp-content/plugins/gatalyn-login-approval/includes
      - ./gatalyn-login-approval.php:/var/www/html/wp-content/plugins/gatalyn-login-approval/gatalyn-login-approval.php
      - ./uninstall.php:/var/www/html/wp-content/plugins/gatalyn-login-approval/uninstall.php
      - ./.docker/wp-cli-install.sh:/workspace/.docker/wp-cli-install.sh

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: wla-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
  wordpress_data:
