<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3378"/>
      <stop offset="100%" stop-color="#2541B2"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="22%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="20%" r="42%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgFace" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#3B5BDB"/>
      <stop offset="55%" stop-color="#22358A"/>
      <stop offset="100%" stop-color="#16235E"/>
    </linearGradient>
    <linearGradient id="bgRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141F54"/>
      <stop offset="100%" stop-color="#0B1130"/>
    </linearGradient>
    <linearGradient id="shackleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="lockBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="checkBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="14" y="10" width="228" height="218" rx="56"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1544" height="500" fill="url(#bannerBg)"/>
  <rect width="1544" height="500" fill="url(#glowLeft)"/>
  <rect width="1544" height="500" fill="url(#glowRight)"/>

  <!-- Subtle decorative rings -->
  <circle cx="310" cy="250" r="195" fill="none" stroke="#93C5FD" stroke-width="1.5" opacity="0.12"/>
  <circle cx="310" cy="250" r="245" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.08"/>
  <circle cx="1390" cy="80" r="170" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.10"/>

  <!-- Flat 3D Icon on the left -->
  <g transform="translate(172, 112) scale(1.08)">
    <rect x="14" y="28" width="228" height="218" rx="56" fill="url(#bgRim)"/>
    <rect x="14" y="10" width="228" height="218" rx="56" fill="url(#bgFace)"/>
    <g clip-path="url(#tileClip)">
      <path d="M14 10 H242 V54 C186 78 70 78 14 54 Z" fill="#FFFFFF" opacity="0.14"/>
      <rect x="18" y="14" width="220" height="210" rx="52" fill="none" stroke="#93C5FD" stroke-width="4" opacity="0.45"/>
    </g>
    <g transform="translate(8, 16)" opacity="0.42">
      <path d="M88 112 V86 C88 63 106 46 128 46 C150 46 168 63 168 86 V112" fill="none" stroke="#0B1130" stroke-width="22" stroke-linecap="round"/>
      <rect x="64" y="104" width="128" height="102" rx="26" fill="#0B1130"/>
    </g>
    <path d="M88 112 V86 C88 63 106 46 128 46 C150 46 168 63 168 86 V112" fill="none" stroke="#64748B" stroke-width="22" stroke-linecap="round" transform="translate(0, 6)"/>
    <path d="M88 112 V86 C88 63 106 46 128 46 C150 46 168 63 168 86 V112" fill="none" stroke="url(#shackleGrad)" stroke-width="22" stroke-linecap="round"/>
    <rect x="64" y="112" width="128" height="98" rx="26" fill="#94A3B8"/>
    <rect x="64" y="102" width="128" height="98" rx="26" fill="url(#lockBody)"/>
    <rect x="67" y="105" width="122" height="92" rx="23" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <circle cx="128" cy="155" r="34" fill="#047857" opacity="0.38"/>
    <circle cx="128" cy="153" r="32" fill="#047857"/>
    <circle cx="128" cy="149" r="32" fill="url(#checkBadge)"/>
    <circle cx="128" cy="149" r="29" fill="none" stroke="#A7F3D0" stroke-width="2" opacity="0.55"/>
    <path d="M113 150 L123.5 160.5 L144.5 138.5" fill="none" stroke="#065F46" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 2.5)" opacity="0.45"/>
    <path d="M113 150 L123.5 160.5 L144.5 138.5" fill="none" stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="515" y="210" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="112" font-weight="700" fill="#FFFFFF">Gatalyn</text>
  <text x="518" y="284" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="56" font-weight="600" fill="#93C5FD">Login Approval</text>
  <text x="520" y="344" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="32" font-weight="400" fill="#CBD5E1">Approve every WordPress login by email or Telegram</text>

  <!-- Feature pills -->
  <g transform="translate(520, 376)">
    <!-- Pill 1 -->
    <rect x="0" y="4" width="248" height="48" rx="24" fill="#0B1130" opacity="0.45"/>
    <rect x="0" y="0" width="248" height="48" rx="24" fill="#1E293B" stroke="#34D399" stroke-width="2" opacity="0.95"/>
    <circle cx="28" cy="24" r="8" fill="#10B981"/>
    <text x="48" y="32" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#F8FAFC">Email Approval</text>

    <!-- Pill 2 -->
    <g transform="translate(268, 0)">
      <rect x="0" y="4" width="256" height="48" rx="24" fill="#0B1130" opacity="0.45"/>
      <rect x="0" y="0" width="256" height="48" rx="24" fill="#1E293B" stroke="#38BDF8" stroke-width="2" opacity="0.95"/>
      <circle cx="28" cy="24" r="8" fill="#38BDF8"/>
      <text x="48" y="32" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#F8FAFC">Telegram Alerts</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(544, 0)">
      <rect x="0" y="4" width="234" height="48" rx="24" fill="#0B1130" opacity="0.45"/>
      <rect x="0" y="0" width="234" height="48" rx="24" fill="#1E293B" stroke="#A78BFA" stroke-width="2" opacity="0.95"/>
      <circle cx="28" cy="24" r="8" fill="#A78BFA"/>
      <text x="48" y="32" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#F8FAFC">1-Click Verify</text>
    </g>
  </g>
</svg>
